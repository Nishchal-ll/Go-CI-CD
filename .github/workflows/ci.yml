name: Go CI

# 1. Triggers: When should this workflow run?
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 2. Jobs: What tasks should run?
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the Go runtime environment
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # Step 3: Verify and download dependencies
      - name: Download Dependencies
        run: go mod download

      # Step 4: Run automated unit tests
      - name: Run Tests
        run: go test -v -race -cover ./...

      # Step 5: Compile / Build binary to verify no build errors
      - name: Build Binary
        run: go build -v -o server .
